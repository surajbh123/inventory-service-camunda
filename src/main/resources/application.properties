# Camunda BPM configuration
camunda.bpm.admin-user.id=admin
camunda.bpm.admin-user.password=admin

# Spring Boot server port
server.port=8081

camunda.datasource.url=jdbc:postgresql://localhost:5432/camunda
camunda.datasource.username=camunda
camunda.datasource.password=camunda
camunda.datasource.driver-class-name=org.postgresql.Driver

# Keep Camunda configured for Postgres
camunda.bpm.database.type=postgres
camunda.bpm.database.schema-update=true

# Initialize schema.sql on startup (ensures the inventory table is created)
spring.sql.init.mode=always
# Prevent JPA from trying to auto-create/validate schema (we use schema.sql / JDBC)
spring.jpa.hibernate.ddl-auto=none

