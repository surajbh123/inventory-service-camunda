
# Spring Boot server port
server.port=8081

# Enable H2 console for debugging (optional)
spring.h2.console.enabled=true

# Prevent JPA from trying to auto-create/validate schema (we use schema.sql / JDBC)
spring.jpa.hibernate.ddl-auto=none
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration, org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# Camunda BPM configuration
camunda.bpm.database.type=h2
camunda.bpm.database.schema-update=true

# Camunda Datasource
camunda.datasource.url=jdbc:h2:mem:camunda;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
camunda.datasource.driver-class-name=org.h2.Driver
camunda.datasource.username=camunda
camunda.datasource.password=camunda
